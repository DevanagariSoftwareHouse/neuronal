name: Build neuronal books
on:
  push:
    branches: [main]
    paths: ["books/**", "latex/**", "mathematics/**", "formal/lean/**", "examples/matlab/**", ".github/workflows/latex-books.yml"]
  pull_request:
    paths: ["books/**", "latex/**", "mathematics/**", "formal/lean/**", "examples/matlab/**", ".github/workflows/latex-books.yml"]

jobs:
  books:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Check both manuscripts
        run: make -C books check
      - name: Build both manuscripts
        run: make -C books all
      - name: Archive PDFs
        uses: actions/upload-artifact@v4
        with:
          name: neuronal-books
          path: |
            books/electrophysiology/build/main.pdf
            books/formal_foundations/build/main.pdf
          if-no-files-found: error
