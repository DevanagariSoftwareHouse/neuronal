name: Build neuronal books
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  books:
    runs-on: [self-hosted, linux, x64, dell]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Dell G15 TeX installation
        run: |
          command -v pdflatex
          command -v bibtex
          command -v make
          pdflatex --version | head -n 1
      - name: Check both manuscripts
        run: make -C books check
      - name: Build both manuscripts
        run: make -C books all
      - name: Archive PDFs
        uses: actions/upload-artifact@v4
        with:
          name: neuronal-books
          path: |
            books/electrophysiology/build/main.pdf
            books/formal_foundations/build/main.pdf
          if-no-files-found: error
