name: Scientific and package validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    name: MATLAB Scientific Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: run('matlab/tests/run_scientific_suite.m')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-scientific-evidence
          path: matlab/build/scientific-tests.log
  registry:
    name: Arsenal Registry and Diff Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make -C books check
      - name: Check patch and tracked artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "${BASE_SHA:-HEAD^}" HEAD
          python3 - <<'PY'
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '--stage'], text=True).splitlines()
          assert not any(line.startswith('160000 ') or '/.lake/' in line for line in tracked)
          PY
  rust:
    name: Rust Build Clippy and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  python:
    name: Python Package and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
