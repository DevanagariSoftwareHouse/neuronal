name: Scientific and package validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab:
    name: MATLAB Scientific Tests
    runs-on: [self-hosted, linux, x64, dell]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify MATLAB R2019a and Signal Processing Toolbox
        shell: bash
        run: |
          command -v matlab-r2019a
          matlab-r2019a -batch "assert(license('test','Signal_Toolbox') == 1); ver"
      - name: Run scientific suite in installed MATLAB
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/matlab/tests/run_scientific_suite.m"
          matlab-r2019a -batch "run('$GITHUB_WORKSPACE/matlab/tests/run_scientific_suite.m')"
      - name: Validate private CON2PHYS recordings
        if: ${{ vars.NEURONAL_CATALOG_PATH != '' }}
        shell: bash
        env:
          NEURONAL_CATALOG_PATH: ${{ vars.NEURONAL_CATALOG_PATH }}
          NEURONAL_DATA_ROOT: ${{ vars.NEURONAL_DATA_ROOT }}
        run: |
          matlab-r2019a -batch "run('$GITHUB_WORKSPACE/analysis/con2phys_real_data_check.m')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-scientific-evidence
          path: matlab/build/scientific-tests.log
  registry:
    name: Arsenal Registry and Diff Integrity
    runs-on: [self-hosted, linux, x64, dell]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make -C books check
      - name: Check patch and tracked artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "${BASE_SHA:-HEAD^}" HEAD
          python3 - <<'PY'
          import subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '--stage'], text=True).splitlines()
          assert not any(line.startswith('160000 ') or '/.lake/' in line for line in tracked)
          PY
  rust:
    name: Rust Build Clippy and Tests
    runs-on: [self-hosted, linux, x64, dell]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Verify host Rust toolchain
        run: |
          cargo --version
          rustc --version
          rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  python:
    name: Python Package and Integration Tests
    runs-on: [self-hosted, linux, x64, dell]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies in an isolated venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install '.[dev,panel]'
      - run: .ci-venv/bin/python -m pytest -q
