name: Storage family contracts
on:
  push:
    branches: [main]
    paths:
      - 'matlab/path/storage_*.m'
      - 'matlab/path/private/storage_*.m'
      - 'matlab/tests/test_storage_family.m'
      - 'matlab/path/spike_interval_*.m'
      - 'matlab/tests/test_spike_interval_features.m'
      - 'analysis/t03_spike_lfp_intervals.m'
      - '.github/workflows/storage-family.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: [self-hosted, linux, x64, dell]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run storage contracts in MATLAB R2019a
        shell: bash
        run: |
          set -o pipefail
          matlab-r2019a -batch "addpath('matlab/path'); addpath('matlab/tests'); test_storage_family; test_spike_interval_features" 2>&1 | tee storage-family-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-family-evidence
          path: storage-family-tests.log
