[workspace]
members = ["crates/neuronal-core", "crates/neuronal-python", "rust/a00_first_look"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ze-gois/neuronal"

[workspace.dependencies]
neuronal-core = { path = "crates/neuronal-core" }
pyo3 = { version = "0.27", features = ["abi3-py310"] }
